version: 1

capabilities:
  model_gateway:
    status: planned
    priority: milestone_1
    candidates:
      - litellm
    notes:
      - Gateway-first is the preferred model access pattern.

  local_runtime_windows:
    status: adopted
    priority: milestone_1
    candidates:
      - ollama
    profiles:
      - windows-personal

  local_runtime_macos:
    status: adopted
    priority: milestone_1
    candidates:
      - omlx
      - ollama
    profiles:
      - macos-work
    notes:
      - oMLX is the preferred Apple Silicon runtime.
      - Ollama remains the local fallback runtime.
      - Both runtimes are managed by the unified workstation lifecycle.

  routing_policy:
    status: planned
    priority: milestone_1
    notes:
      - Routing should be profile-aware, sensitivity-aware and explainable.

  secrets_management:
    status: planned
    priority: milestone_1
    candidates:
      - bitwarden
      - env_local_fallback
    notes:
      - Bitwarden is preferred.
      - .env.local is fallback only.

  cli_general_assistant:
    status: planned
    priority: milestone_1
    commands:
      - ask-ai

  validation:
    status: planned
    priority: milestone_1
    commands:
      - ai-status
      - ai-bootstrap-check

  model_fitness:
    status: planned
    priority: milestone_3
    candidates:
      - llmfit
      - gateway_based_checks

  chat_ui:
    status: adopted
    priority: milestone_4
    candidates:
      - librechat
    notes:
      - LibreChat v0.8.7 is the selected browser chat UI.
      - Its reproducible service lifecycle is defined under containers/librechat.
      - LiteLLM is its only configured model endpoint.
      - The UI is localhost-bound and validated with just ui-check.
      - Accounts and conversations use profile-scoped persistent storage.

  cli_coding_assistant:
    status: planned
    priority: milestone_5
    candidates:
      - aider
      - opencode

  agent_runner:
    status: future
    priority: milestone_7
    candidates:
      - goose

  rag_project_memory:
    status: future
    priority: milestone_8
