services:
  database:
    image: docker.io/library/postgres:16.15-alpine3.24
    restart: "no"
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: "${LITELLM_DATABASE_PASSWORD:?LITELLM_DATABASE_PASSWORD must be set}"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - database-data:/var/lib/postgresql/data

  gateway:
    image: docker.io/litellm/litellm:1.90.0-rc.1
    platform: linux/arm64
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set}"
      LITELLM_SALT_KEY: "${LITELLM_SALT_KEY:?LITELLM_SALT_KEY must be set}"
      DATABASE_URL: "postgresql://litellm:${LITELLM_DATABASE_PASSWORD:?LITELLM_DATABASE_PASSWORD must be set}@database:5432/litellm"
      OMLX_API_KEY: "${OMLX_API_KEY:?OMLX_API_KEY must be resolved from oMLX settings}"
    command:
      - --config
      - /app/config.yaml
      - --host
      - 0.0.0.0
      - --port
      - "4000"
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - type: bind
        source: ../../config/gateway/litellm/config.local.yaml
        target: /app/config.yaml
        read_only: true

volumes:
  database-data:
